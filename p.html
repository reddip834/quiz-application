
<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .result-box {
            background: white;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        h1 {
            color: #174a78;
        }

        .score {
            font-size: 45px;
            color: green;
            font-weight: bold;
            margin: 20px;
        }

        .message {
            font-size: 18px;
            color: #444;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #104b7a;
        }
    </style>
</head>

<body>

    <div class="result-box">

        <h1>Quiz Completed!</h1>

        <p class="message">
            Congratulations! You completed the RRB Clerk Quiz.
        </p>

        <p>Your Final Score</p>

        <div class="score">
            {{ score }} / {{ total }}
        </div>

        {% if score >= 8 %}
            <h3 style="color:green;">Excellent Performance!</h3>
        {% elif score >= 5 %}
            <h3 style="color:orange;">Good Job! Keep Practicing!</h3>
        {% else %}
            <h3 style="color:red;">Keep Practicing!</h3>
        {% endif %}

        <a href="/restart">
            <button>Restart Quiz</button>
        </a>

        <br>

        <a href="/">
            <button>Go to Home</button>
        </a>

    </div>

</body>
</html>
